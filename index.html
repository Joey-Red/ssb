<!doctype html>
<html lang="en" data-theme="festival">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff3d6" />
    <meta name="description" content="A fast, source-aware Super Smash Bros. Ultimate training companion." />
    <script>
      try {
        const storedTheme = localStorage.getItem('ssbu-training-guide:theme')
        if (storedTheme === 'titan' || storedTheme === 'festival') document.documentElement.dataset.theme = storedTheme
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>SSBU Training Festival</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
