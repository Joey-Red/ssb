name: Pro Lab maintenance audit

on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Audit Pro Lab source links
        run: node scripts/audit-pro-lab-links.mjs --live

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pro-lab-link-audit
          path: pro-lab-link-audit.json
          if-no-files-found: error
