name: Vendor static visual assets

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'scripts/discover-ufd-visuals.py'
      - 'scripts/discover-ufd-precise-visuals.py'
      - 'scripts/discover-external-visuals.py'
      - 'scripts/discover-smashwiki-filename-visuals.py'
      - 'scripts/discover-smashwiki-shorthand-visuals.py'
      - 'scripts/discover-smashwiki-curated-gap-visuals.py'
      - 'scripts/reconcile-external-visuals.py'
      - 'scripts/normalize-visual-source-provenance.py'
      - 'scripts/resolve-ruben-timing.py'
      - 'scripts/apply-generated-timing-overrides.py'
      - 'scripts/select-smashwiki-historical-visuals.py'
      - 'scripts/revendor-historical-visuals.py'
      - 'scripts/analyze-ultimate-hitboxes-archive.py'
      - 'scripts/vendor-static-assets.py'
      - 'scripts/vendor-full-motion-assets.py'
      - 'scripts/build-runtime-visual-index.py'
      - 'scripts/audit-visual-coverage.py'
      - 'scripts/build-visual-capture-queue.py'
      - 'scripts/build-visual-completion-summary.py'
      - 'scripts/build-synthetic-visual-fallbacks.py'
      - 'scripts/check-visual-coverage.py'
      - 'scripts/import-visual-captures.py'
      - 'scripts/requirements-media.txt'
      - 'src/data/visualTimelineOverrides.json'
      - 'src/data/ufd-manifest.json'
      - 'src/data/frameData.generated.json'
      - '.github/workflows/vendor-static-assets.yml'

permissions:
  contents: write

concurrency:
  group: visual-vendor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discovery-audit:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-media.txt
      - name: Install discovery tooling
        run: pip install -r scripts/requirements-media.txt
      - name: Discover precise full-roster UFD visuals
        run: |
          python scripts/discover-ufd-precise-visuals.py
          python scripts/audit-visual-coverage.py
          cp src/data/visualCoverageAudit.generated.json /tmp/visual-audit-before.json
      - name: Recover external source visuals
        run: |
          python scripts/discover-external-visuals.py
          python scripts/discover-smashwiki-filename-visuals.py
          python scripts/discover-smashwiki-shorthand-visuals.py
          python scripts/discover-smashwiki-curated-gap-visuals.py
          python scripts/audit-visual-coverage.py
      - name: Write measurable discovery summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          before = json.loads(Path('/tmp/visual-audit-before.json').read_text())
          after = json.loads(Path('src/data/visualCoverageAudit.generated.json').read_text())
          external = json.loads(Path('src/data/externalVisualSources.generated.json').read_text())
          filename = json.loads(Path('src/data/smashwikiFilenameVisuals.generated.json').read_text())
          shorthand = json.loads(Path('src/data/smashwikiShorthandVisuals.generated.json').read_text())
          curated = json.loads(Path('src/data/smashwikiCuratedGapVisuals.generated.json').read_text())
          summary = {
              'sourceLessBeforeExternalDiscovery': before['movesWithoutSourceVisual'],
              'sourceLessAfterExternalDiscovery': after['movesWithoutSourceVisual'],
              'sourceLessMovesRecoveredThisPass': before['movesWithoutSourceVisual'] - after['movesWithoutSourceVisual'],
              'externalTableParserAddedMoves': external['addedMoves'],
              'filenameSweepRecoveredMoves': filename['recoveredSourceLessMoves'],
              'shorthandRecoveredMoves': shorthand['recoveredSourceLessMoves'],
              'curatedRecoveredMoves': curated['recoveredSourceLessMoves'],
              'filenameSweepFilesScanned': filename['filesScanned'],
              'mappedSourceVisualMovesAfterDiscovery': after['mappedSourceVisualMoves'],
          }
          Path('visual-discovery-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY
      - name: Upload discovery audit
        uses: actions/upload-artifact@v4
        with:
          name: visual-discovery-audit
          path: |
            visual-discovery-summary.json
            src/data/externalVisualSources.generated.json
            src/data/smashwikiFilenameVisuals.generated.json
            src/data/smashwikiShorthandVisuals.generated.json
            src/data/smashwikiCuratedGapVisuals.generated.json
            src/data/visualCoverageAudit.generated.json
          retention-days: 7

  vendor:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout writable branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-media.txt
      - name: Install media tooling
        run: pip install -r scripts/requirements-media.txt
      - name: Discover precise full-roster UFD visuals
        run: python scripts/discover-ufd-precise-visuals.py
      - name: Refresh source-less targets after UFD discovery
        run: python scripts/audit-visual-coverage.py
      - name: Discover curated external visuals
        run: python scripts/discover-external-visuals.py
      - name: Recover filename-only SmashWiki animations
        run: python scripts/discover-smashwiki-filename-visuals.py
      - name: Recover shorthand SmashWiki animations
        run: python scripts/discover-smashwiki-shorthand-visuals.py
      - name: Recover verified curated SmashWiki gaps
        run: python scripts/discover-smashwiki-curated-gap-visuals.py
      - name: Reconcile stronger external replacements
        run: python scripts/reconcile-external-visuals.py
      - name: Normalize multi-source provenance
        run: python scripts/normalize-visual-source-provenance.py
      - name: Resolve conservative Ruben timing evidence
        run: python scripts/resolve-ruben-timing.py
      - name: Apply generated timing evidence for vendoring
        run: python scripts/apply-generated-timing-overrides.py
      - name: Vendor full-motion visual assets
        run: python scripts/vendor-full-motion-assets.py
      - name: Select better SmashWiki historical revisions
        run: python scripts/select-smashwiki-historical-visuals.py
      - name: Re-vendor selected historical revisions only
        run: python scripts/revendor-historical-visuals.py
      - name: Corroborate residuals with Ultimate Hitboxes metadata
        run: python scripts/analyze-ultimate-hitboxes-archive.py
      - name: Restore human-reviewed timing registry
        run: git checkout -- src/data/visualTimelineOverrides.json
      - name: Build per-fighter runtime visual indexes
        run: python scripts/build-runtime-visual-index.py
      - name: Audit source-backed visual coverage
        run: python scripts/audit-visual-coverage.py
      - name: Build deterministic capture queue
        run: python scripts/build-visual-capture-queue.py
      - name: Build completion summary
        run: python scripts/build-visual-completion-summary.py
      - name: Build illustrative source-less fallbacks
        run: python scripts/build-synthetic-visual-fallbacks.py
      - name: Commit discovered and vendored media
        shell: bash
        run: |
          set -euo pipefail
          branch="${{ github.event.pull_request.head.ref || github.ref_name }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/media public/data/visual-media \
            src/data/visualMediaSources.json \
            src/data/externalVisualSources.generated.json \
            src/data/smashwikiFilenameVisuals.generated.json \
            src/data/smashwikiShorthandVisuals.generated.json \
            src/data/smashwikiCuratedGapVisuals.generated.json \
            src/data/smashwikiHistoricalVisuals.generated.json \
            src/data/rubenTimingOverrides.generated.json \
            src/data/ultimateHitboxesArchive.generated.json \
            src/data/visualMediaAssets.generated.json \
            src/data/visualMediaCoverage.generated.json \
            src/data/visualCoverageAudit.generated.json \
            src/data/visualCaptureQueue.generated.json \
            src/data/visualSyntheticFallbacks.generated.json \
            docs/VISUAL_COVERAGE_AUDIT.generated.md \
            docs/VISUAL_COMPLETION_SUMMARY.generated.md
          if git diff --cached --quiet; then
            echo 'Full-roster multi-source visual assets are already current.'
            exit 0
          fi
          git commit -m 'chore: vendor multi-source full-motion visuals'
          git pull --rebase origin "$branch"
          git push origin HEAD:"$branch"