name: Vendor static visual assets

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'scripts/discover-ufd-visuals.py'
      - 'scripts/vendor-static-assets.py'
      - 'scripts/vendor-full-motion-assets.py'
      - 'scripts/build-runtime-visual-index.py'
      - 'scripts/audit-visual-coverage.py'
      - 'scripts/build-visual-capture-queue.py'
      - 'scripts/check-visual-coverage.py'
      - 'scripts/import-visual-captures.py'
      - 'scripts/requirements-media.txt'
      - 'src/data/visualTimelineOverrides.json'
      - 'src/data/ufd-manifest.json'
      - 'src/data/frameData.generated.json'
      - '.github/workflows/vendor-static-assets.yml'

permissions:
  contents: write

concurrency:
  group: visual-vendor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vendor:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout writable branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-media.txt
      - name: Install media tooling
        run: pip install -r scripts/requirements-media.txt
      - name: Discover full-roster UFD visuals
        run: python scripts/discover-ufd-visuals.py
      - name: Vendor full-motion visual assets
        run: python scripts/vendor-full-motion-assets.py
      - name: Build per-fighter runtime visual indexes
        run: python scripts/build-runtime-visual-index.py
      - name: Audit visual coverage
        run: python scripts/audit-visual-coverage.py
      - name: Build deterministic capture queue
        run: python scripts/build-visual-capture-queue.py
      - name: Commit discovered and vendored media
        shell: bash
        run: |
          set -euo pipefail
          branch="${{ github.event.pull_request.head.ref || github.ref_name }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/media public/data/visual-media \
            src/data/visualMediaSources.json \
            src/data/visualMediaAssets.generated.json \
            src/data/visualMediaCoverage.generated.json \
            src/data/visualCoverageAudit.generated.json \
            src/data/visualCaptureQueue.generated.json \
            docs/VISUAL_COVERAGE_AUDIT.generated.md
          if git diff --cached --quiet; then
            echo 'Full-roster full-motion visual assets are already current.'
            exit 0
          fi
          git commit -m 'chore: vendor full-roster full-motion visuals'
          git pull --rebase origin "$branch"
          git push origin HEAD:"$branch"
