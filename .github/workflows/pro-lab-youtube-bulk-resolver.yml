name: Pro Lab YouTube bulk resolver

on:
  push:
    branches:
      - pro-lab/resolver-v2-bulk-350
    paths:
      - scripts/resolve-pro-lab-youtube-links.ts
      - .github/workflows/pro-lab-youtube-bulk-resolver.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install -q -U yt-dlp
      - uses: actions/cache@v4
        with:
          path: .cache/pro-lab-youtube-resolver
          key: pro-lab-youtube-resolver-v1-${{ runner.os }}
      - name: Resolve indexed links
        env:
          PRO_LAB_YT_SEARCH_CONCURRENCY: '12'
          PRO_LAB_YT_METADATA_CONCURRENCY: '24'
          PRO_LAB_YT_SEARCH_LIMIT: '25'
        run: ./node_modules/.bin/vite-node scripts/resolve-pro-lab-youtube-links.ts pro-lab-youtube-resolutions.json src/data/proLabVodLinkResolutionsBulk2.ts
      - name: Report totals
        run: jq '{sourceIndexedInput,searchGroups,uniquePairCandidates,datedCandidates,resolvedCount,unresolvedSourceIndexedAfter,totalCatalogSourceIndexBefore,projectedTotalCatalogSourceIndexAfter,ambiguous:(.ambiguous|length),noExactDateCandidate:(.noExactDateCandidate|length),searchErrors:(.searchErrors|length)}' pro-lab-youtube-resolutions.json
      - uses: actions/upload-artifact@v4
        with:
          name: pro-lab-youtube-resolutions
          path: pro-lab-youtube-resolutions.json
          if-no-files-found: error
      - name: Commit verified map
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/data/proLabVodLinkResolutionsBulk2.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate exact-date Pro Lab YouTube resolution map'
          git push
