name: Pro Lab YouTube search probe

on:
  push:
    branches:
      - pro-lab/resolver-v2-bulk-350
    paths:
      - .github/workflows/pro-lab-youtube-search-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install yt-dlp
        run: python -m pip install -q -U yt-dlp
      - name: Inspect flat search metadata
        shell: bash
        run: |
          set -o pipefail
          yt-dlp --flat-playlist --playlist-end 3 --dump-json 'ytsearch3:Peabnut Light Smash Ultimate 2026' | python -c 'import sys,json; [print(json.dumps(json.loads(x),sort_keys=True)) for x in sys.stdin if x.strip()]'
