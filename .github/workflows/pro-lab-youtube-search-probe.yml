name: Pro Lab YouTube search probe

on:
  push:
    branches:
      - pro-lab/resolver-v2-bulk-350
    paths:
      - .github/workflows/pro-lab-youtube-search-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install yt-dlp
        run: python -m pip install -q -U yt-dlp
      - name: Validate candidate metadata dates
        shell: bash
        run: |
          set +e
          ids=(B7DSJLEf0Hk M4JeXDUVrug NVVljju3FNg WT6LX1VSnzo tZXHhTDEkYU ZFtJJbhLy80)
          for id in "${ids[@]}"; do
            echo "===== $id ====="
            yt-dlp --skip-download --no-playlist --print '%(id)s | %(title)s | %(upload_date)s | %(timestamp)s | %(channel)s' "https://www.youtube.com/watch?v=$id" 2>&1 | tail -20
          done
