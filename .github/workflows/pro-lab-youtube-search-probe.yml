name: Pro Lab YouTube search probe

on:
  push:
    branches:
      - pro-lab/resolver-v2-bulk-350
    paths:
      - .github/workflows/pro-lab-youtube-search-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe dated search APIs
        shell: bash
        run: |
          set +e
          q='Peabnut Light Smash Ultimate 2026'
          for base in \
            'https://inv.nadeko.net' \
            'https://invidious.nerdvpn.de' \
            'https://yt.chocolatemoo53.com'; do
            echo "===== $base ====="
            status=$(curl --max-time 15 -sS -G -o /tmp/out -w '%{http_code}' \
              --data-urlencode "q=$q" --data 'type=video' "$base/api/v1/search" || true)
            echo "HTTP=$status BYTES=$(wc -c </tmp/out)"
            python - <<'PY'
import json
try:
    data=json.load(open('/tmp/out'))
    for x in data[:8]:
        if x.get('type')=='video':
            print(x.get('videoId'), x.get('published'), x.get('publishedText'), '|', x.get('title'), '|', x.get('author'))
except Exception as e:
    print('PARSE_ERROR', e, open('/tmp/out','r',errors='replace').read()[:400])
PY
          done
