name: Pro Lab literal Japanese source recovery

on:
  push:
    branches:
      - pro-lab/resolver-v10-raru-alias

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -q -U yt-dlp
      - name: Literal source searches
        shell: bash
        run: |
          set -euo pipefail
          queries=(
            'DELTA×西武撃 TOP48 FENNEL Miya Reno セフィロス'
            'INNOSUMA GRAND II Winners Quarters らる シオン'
            'INNOSUMA GRAND II Losers Semis らる シオン'
            'INNOSUMA GRAND II Winners Semis らる さや'
            "マエスマ'1on1#19 R3 あしも いーじす"
            '篝火#5 シグマ トゥーンリンク GRN てぃー パックマン'
            'マエスマTOP#14.5 in 兵庫 WR5 かになべ マネーライト'
            '第27回スマバトSP かになべ らるくん 敗者側7回戦'
            '桜梅桃李 第壱幕 Winners Top 24 もえないごみ らき'
            '桜梅桃李 第壱幕 Winners Semis らるくん らき'
            '桜梅桃李 第壱幕 Winners Quarters うめき らき'
            '桜梅桃李 第壱幕 Losers Quarters ヨシドラ らき'
            "マエスマ'HIT#59 in 梅田 GF らき Mark"
            "マエスマ'HIT#59 in 梅田 WF シオン らき"
            "マエスマ'HIT#58 in 枚方 GF シオン らき"
            "マエスマ'HIT Championship LTOP4 らき Hurt"
            "マエスマ'HIT Championship Raki Hurt"
            "マエスマ'1on1#132 R4 ヨシドラ ジョニー"
            'Crown the Third Shuton Zomba Winners Final'
            'Ultimate Arena Smash Finale MkLeo MKBigBoss singles'
          )
          : > literal-results.txt
          for q in "${queries[@]}"; do
            echo "===== $q =====" | tee -a literal-results.txt
            yt-dlp --flat-playlist --playlist-end 15 --print '%(id)s | %(title)s | %(channel)s' "ytsearch15:$q" | tee -a literal-results.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pro-lab-literal-source-results
          path: literal-results.txt
