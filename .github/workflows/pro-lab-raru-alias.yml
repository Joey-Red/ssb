name: Pro Lab final alias date verification

on:
  push:
    branches:
      - pro-lab/resolver-v10-raru-alias

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Fetch exact publish dates
        shell: python
        run: |
          import json, re, urllib.request
          ids=['uDZxY_0NpIQ','DjPfuhi2ZyY','7H4oES3_EMQ','iDgc_PiLALY']
          key='AIzaSyAO_FJ2SlqU8Q4STEHLGCilw_Y9_11qcW8'
          url=f'https://www.youtube.com/youtubei/v1/next?key={key}&prettyPrint=false'
          def walk(x):
            if isinstance(x,dict):
              dt=x.get('dateText')
              if isinstance(dt,dict):
                s=dt.get('simpleText')
                if isinstance(s,str) and re.fullmatch(r'[A-Z][a-z]{2} \d{1,2}, \d{4}',s): return s
              for v in x.values():
                r=walk(v)
                if r:return r
            elif isinstance(x,list):
              for v in x:
                r=walk(v)
                if r:return r
            return None
          for vid in ids:
            body=json.dumps({'context':{'client':{'clientName':'WEB','clientVersion':'2.20260820.01.00','hl':'en','gl':'US'}},'videoId':vid}).encode()
            req=urllib.request.Request(url,data=body,headers={'content-type':'application/json','user-agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=20) as resp:data=json.load(resp)
            print(f'{vid} | {walk(data)}')
