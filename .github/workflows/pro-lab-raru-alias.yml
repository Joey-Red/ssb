name: Pro Lab final Moenai goma recovery

on:
  push:
    branches:
      - pro-lab/resolver-v10-raru-alias

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -q -U yt-dlp
      - name: Exact corrected source title
        shell: bash
        run: |
          set -euo pipefail
          yt-dlp --flat-playlist --playlist-end 20 --print '%(id)s | %(title)s | %(channel)s' "ytsearch20:桜梅桃李 第壱幕 Winners Top 24 もえないごま リドリー らき スティーブ カズヤ"
