name: Pro Lab alias retry

on:
  push:
    branches: [pro-lab/resolver-v5-aliases]
    paths:
      - .github/workflows/pro-lab-alias-retry.yml

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Sparse checkout resolver inputs
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/workflows/pro-lab-alias-retry.yml
            scripts/resolve-pro-lab-alias-retry.ts
            src/data
            src/lib
            package.json
            package-lock.json
            tsconfig.json
            tsconfig.app.json
            tsconfig.node.json
            vite.config.ts
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - run: npm ci --no-audit --no-fund
      - run: python -m pip install -q -U yt-dlp

      - name: Restore alias resolver cache
        uses: actions/cache@v4
        with:
          path: .cache/pro-lab-alias-retry
          key: pro-lab-alias-retry-v1-${{ runner.os }}

      - name: Resolve alias and Unicode remainder
        env:
          PRO_LAB_ALIAS_SEARCH_CONCURRENCY: '18'
          PRO_LAB_ALIAS_SEARCH_LIMIT: '20'
        run: ./node_modules/.bin/vite-node scripts/resolve-pro-lab-alias-retry.ts pro-lab-alias-retry.json

      - name: Report totals
        run: jq '{unresolvedInput,searchJobs,pairCandidateVideos,suggestedCount,noCandidateCount,ambiguousCount,searchErrors}' pro-lab-alias-retry.json

      - uses: actions/upload-artifact@v4
        with:
          name: pro-lab-alias-retry
          path: pro-lab-alias-retry.json
          if-no-files-found: error
