name: Pro Lab Invidious probe

on:
  push:
    branches:
      - pro-lab/resolver-v2-bulk-350
    paths:
      - .github/workflows/pro-lab-invidious-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public instances
        run: |
          set +e
          for base in https://inv.nadeko.net https://invidious.nerdvpn.de https://yt.chocolatemoo53.com; do
            echo "===== $base ====="
            curl --max-time 15 -sS -G --data-urlencode 'q=Peabnut Light Smash Ultimate 2026' --data 'type=video' "$base/api/v1/search" -o out.json
            echo "HTTP_EXIT=$? BYTES=$(wc -c < out.json)"
            head -c 500 out.json; echo
          done
          echo '===== PIPED ====='
          for base in https://pipedapi.kavin.rocks https://pipedapi.adminforge.de https://pipedapi.reallyaweso.me; do
            echo "--- $base ---"
            curl --max-time 15 -sS -G --data-urlencode 'q=Peabnut Light Smash Ultimate 2026' --data 'filter=videos' "$base/search" -o out.json
            echo "HTTP_EXIT=$? BYTES=$(wc -c < out.json)"
            head -c 500 out.json; echo
          done
