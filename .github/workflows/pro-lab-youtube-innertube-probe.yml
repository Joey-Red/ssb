name: Pro Lab YouTube Innertube probe

on:
  push:
    branches:
      - pro-lab/resolver-v2-bulk-350
    paths:
      - .github/workflows/pro-lab-youtube-innertube-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe exact publish dates
        shell: bash
        run: |
          set +e
          key='AIzaSyAO_FJ2SlqU8Q4STEHLGCilw_Y9_11qcW8'
          for id in B7DSJLEf0Hk M4JeXDUVrug NVVljju3FNg WT6LX1VSnzo tZXHhTDEkYU ZFtJJbhLy80; do
            echo "===== $id ====="
            payload=$(jq -nc --arg id "$id" '{context:{client:{clientName:"WEB",clientVersion:"2.20260820.01.00",hl:"en",gl:"US"}},videoId:$id}')
            curl --max-time 15 -sS -X POST \
              -H 'content-type: application/json' \
              -H 'user-agent: Mozilla/5.0' \
              --data "$payload" \
              "https://www.youtube.com/youtubei/v1/next?key=$key&prettyPrint=false" -o out.json
            echo "BYTES=$(wc -c < out.json)"
            jq -r '[.. | objects | select(has("dateText")) | .dateText.simpleText] | unique | .[]' out.json 2>/dev/null | head -10
            jq -r '[.. | objects | select(has("title")) | .title.runs?[0].text? // empty] | unique | .[]' out.json 2>/dev/null | head -5
            head -c 120 out.json; echo
          done
