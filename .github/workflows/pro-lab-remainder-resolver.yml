name: Pro Lab remainder resolver

on:
  push:
    branches: [pro-lab/resolver-v3-remainder]
    paths:
      - .github/workflows/pro-lab-remainder-resolver.yml

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Sparse checkout resolver inputs
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/workflows/pro-lab-remainder-resolver.yml
            scripts/resolve-pro-lab-youtube-remainder.ts
            src/data
            package.json
            package-lock.json
            tsconfig.json
            tsconfig.app.json
            tsconfig.node.json
            vite.config.ts
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install yt-dlp
        run: python -m pip install -q -U yt-dlp

      - name: Restore resolver cache
        uses: actions/cache@v4
        with:
          path: .cache/pro-lab-youtube-resolver
          key: pro-lab-youtube-remainder-v1-${{ runner.os }}
          restore-keys: |
            pro-lab-youtube-resolver-v1-${{ runner.os }}

      - name: Resolve remainder
        env:
          PRO_LAB_YT_SEARCH_CONCURRENCY: '20'
          PRO_LAB_YT_METADATA_CONCURRENCY: '28'
          PRO_LAB_YT_SEARCH_LIMIT: '30'
        run: ./node_modules/.bin/vite-node scripts/resolve-pro-lab-youtube-remainder.ts pro-lab-youtube-remainder-resolutions.json src/data/proLabVodLinkResolutionsBulk4.ts

      - name: Report totals
        run: |
          jq '{remainingInput,siblingResolved,searchInput,searchGroups,searchJobs,pairCandidates,datedCandidates,resolvedCount,projectedTotalCatalogSourceIndexAfter,methodCounts,ambiguous:(.ambiguous|length),noCandidate:(.noCandidate|length),dateRejected:(.dateRejected|length),searchErrors:(.searchErrors|length)}' pro-lab-youtube-remainder-resolutions.json

      - name: Upload resolution outputs
        uses: actions/upload-artifact@v4
        with:
          name: pro-lab-youtube-remainder-resolutions
          path: |
            pro-lab-youtube-remainder-resolutions.json
            src/data/proLabVodLinkResolutionsBulk4.ts
          if-no-files-found: error
