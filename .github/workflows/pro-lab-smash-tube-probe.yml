name: Pro Lab Smash Tube probe

on:
  push:
    branches:
      - pro-lab/direct-link-resolution-bulk-1

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect one pair index
        shell: bash
        run: |
          set -u
          url='https://www.smash-tube.com/en/result?player1=Sonix&player2=Tweek'
          status=$(curl -L -A 'Mozilla/5.0' -sS -o /tmp/page -w '%{http_code}' "$url" || true)
          echo "HTTP=$status BYTES=$(wc -c </tmp/page)"
          grep -Eo 'https?://[^"<> ]+|href="[^"]+"|youtube[^"<> ]+' /tmp/page | head -200 || true
          echo '===== MATCH CONTEXT ====='
          grep -in -E 'Sonix|Tweek|youtube|watch\?v=' /tmp/page | head -100 || true
