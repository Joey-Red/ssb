name: Pro Lab targeted remainder recovery

on:
  push:
    branches:
      - pro-lab/resolver-v9-remainder79

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -q -U yt-dlp
      - name: Resolve exact named-event titles
        shell: bash
        run: |
          set -euo pipefail
          queries=(
            'Patchwork 2026 Winners Quarters Ploopi xcx Dany Wolf'
            'Patchwork 2026 Losers Semis Light Fox Ploopi xcx Game Watch'
            'Patchwork 2026 Losers Top 8 Lui$ Palutena Ploopi xcx Game Watch'
            'Patchwork 2026 Losers Quarters Jahzz0 Ryu Ploopi xcx Game Watch'
            'スノー Mario Pyra Zawg Duck Hunt Top 64 Battle of BC 8'
            'チノスマ1on1 334 2回戦 あり デデデ あしも リュウ'
          )
          : > targeted-results.txt
          for q in "${queries[@]}"; do
            echo "===== $q =====" | tee -a targeted-results.txt
            yt-dlp --flat-playlist --playlist-end 8 --print '%(id)s | %(title)s' "ytsearch8:$q" | tee -a targeted-results.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pro-lab-targeted-results
          path: targeted-results.txt
