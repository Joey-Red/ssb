name: Pro Lab remainder 79 recovery

on:
  push:
    branches:
      - pro-lab/resolver-v9-remainder79

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Sparse checkout resolver inputs
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/workflows/pro-lab-remainder79.yml
            scripts/resolve-pro-lab-alias-retry.ts
            src/data
            src/lib
            package.json
            package-lock.json
            tsconfig.json
            tsconfig.app.json
            tsconfig.node.json
            vite.config.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install -q -U yt-dlp
      - name: Restore resolver cache
        uses: actions/cache@v4
        with:
          path: .cache/pro-lab-alias-retry
          key: pro-lab-alias-retry-v1-${{ runner.os }}
      - name: Expand diagnostic report
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/resolve-pro-lab-alias-retry.ts')
          s = p.read_text()
          s = s.replace(
              "    opponentTag: record.opponentTag,\n    candidateCount: scored.length,",
              "    opponentTag: record.opponentTag,\n    playerFighterIds: record.playerFighterIds,\n    round: record.round,\n    datePrecision: record.datePrecision,\n    candidateCount: scored.length,",
          )
          s = s.replace("    candidates: scored.slice(0, 12),", "    candidates: scored,")
          p.write_text(s)
          PY
      - name: Resolve current remainder
        env:
          PRO_LAB_ALIAS_SEARCH_CONCURRENCY: '18'
          PRO_LAB_ALIAS_SEARCH_LIMIT: '50'
        run: ./node_modules/.bin/vite-node scripts/resolve-pro-lab-alias-retry.ts pro-lab-remainder79.json
      - name: Report totals
        run: jq '{unresolvedInput,searchJobs,pairCandidateVideos,suggestedCount,noCandidateCount,ambiguousCount,searchErrors}' pro-lab-remainder79.json
      - uses: actions/upload-artifact@v4
        with:
          name: pro-lab-remainder79-full
          path: pro-lab-remainder79.json
