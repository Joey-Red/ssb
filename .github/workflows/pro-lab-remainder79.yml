name: Pro Lab remainder 79 recovery

on:
  push:
    branches:
      - pro-lab/resolver-v9-remainder79

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Sparse checkout resolver inputs
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/workflows/pro-lab-remainder79.yml
            scripts/resolve-pro-lab-alias-retry.ts
            scripts/dump-pro-lab-unresolved.ts
            src/data
            src/lib
            package.json
            package-lock.json
            tsconfig.json
            tsconfig.app.json
            tsconfig.node.json
            vite.config.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Dump unresolved metadata
        run: ./node_modules/.bin/vite-node scripts/dump-pro-lab-unresolved.ts pro-lab-unresolved.json
      - uses: actions/upload-artifact@v4
        with:
          name: pro-lab-unresolved-metadata
          path: pro-lab-unresolved.json
