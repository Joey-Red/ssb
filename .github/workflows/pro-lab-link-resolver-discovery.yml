name: Pro Lab link resolver discovery

on:
  push:
    branches:
      - pro-lab/direct-link-resolution-bulk-1

permissions:
  contents: read

jobs:
  discover-api:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Smasharchives public API
        shell: bash
        run: |
          set -euo pipefail

          echo '===== DOCUMENTATION HTML ====='
          curl -L -sS https://api.smasharchives.com/documentation/ -o /tmp/docs
          head -c 20000 /tmp/docs
          echo
          echo '===== DOC URL HINTS ====='
          grep -Eo 'https?[^"'"' ]+|url:[[:space:]]*[^,}]+' /tmp/docs | head -100 || true
          echo

          for url in \
            'https://api.smasharchives.com/character' \
            'https://api.smasharchives.com/vod/character?character1=1' \
            'https://api.smasharchives.com/vod/player?player1=Sonix' \
            'https://api.smasharchives.com/player?name=Sonix' \
            'https://api.smasharchives.com/search?query=Sonix'; do
            echo "===== $url ====="
            status=$(curl -L -sS -o /tmp/response -w '%{http_code}' "$url" || true)
            echo "HTTP $status"
            head -c 16000 /tmp/response || true
            echo
          done
