name: Pro Lab link resolver discovery

on:
  push:
    branches:
      - pro-lab/direct-link-resolution-bulk-1

permissions:
  contents: read

jobs:
  discover-api:
    runs-on: ubuntu-latest
    steps:
      - name: Probe player lookup and VOD pages
        shell: bash
        run: |
          set -u
          for name in Sonix Hurt Peabnut ShinyMark; do
            echo "===== PLAYER SEARCH: $name ====="
            curl -L -sS --get --data-urlencode "name=$name" https://api.smasharchives.com/player/search
            echo
          done
          echo '===== SONIX VODS PAGE 1 ====='
          sonix_id=$(curl -L -sS --get --data-urlencode 'name=Sonix' https://api.smasharchives.com/player/search | python3 -c 'import json,sys; x=json.load(sys.stdin); print(x[0]["id"] if x else "")')
          echo "SONIX_ID=$sonix_id"
          curl -L -sS --get --data-urlencode "playerId=$sonix_id" --data-urlencode 'page=1' https://api.smasharchives.com/vod/player | head -c 40000
          echo
