name: Pro Lab link resolver discovery

on:
  push:
    branches:
      - pro-lab/direct-link-resolution-bulk-1

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Resolve source indexes against Smasharchives
        run: ./node_modules/.bin/vite-node scripts/resolve-pro-lab-links.ts pro-lab-link-resolutions.json
      - uses: actions/upload-artifact@v4
        with:
          name: pro-lab-link-resolutions
          path: pro-lab-link-resolutions.json
          if-no-files-found: error
