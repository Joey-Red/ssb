name: Final runtime visual completion

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - 'scripts/build-defense-timing-evidence.py'
      - 'scripts/build-synthetic-visual-fallbacks.py'
      - 'scripts/build-synthetic-phase-sheets.py'
      - 'scripts/audit-runtime-visual-completion.py'
      - 'src/components/MoveFrameViewer.tsx'
      - 'src/types.ts'
      - '.github/workflows/final-runtime-visual-completion.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-runtime-visual-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  complete-runtime-visuals:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout writable branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Record starting head
        run: echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-media.txt

      - name: Install media tooling
        run: pip install -r scripts/requirements-media.txt

      - name: Rebuild authoritative runtime indexes
        run: python scripts/build-runtime-visual-index.py

      - name: Reapply local source-animation players
        run: python scripts/apply-local-source-players-to-runtime.py

      - name: Reapply related-source display fallbacks
        run: python scripts/build-related-source-runtime-fallbacks.py

      - name: Build every remaining timing schematic and local sheet
        run: python scripts/build-synthetic-visual-fallbacks.py

      - name: Hard audit 3588 of 3588 local playable visuals
        run: python scripts/audit-runtime-visual-completion.py

      - name: Preserve factual source audit separation
        run: python scripts/audit-visual-coverage.py

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Full application quality gate
        run: npm run check

      - name: Commit final local visual runtime
        shell: bash
        run: |
          set -euo pipefail
          branch="${{ github.event.pull_request.head.ref || github.ref_name }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            public/data/visual-media \
            public/media/synthetic-phase-sheets \
            src/data/visualDefenseTiming.generated.json \
            src/data/visualSyntheticFallbacks.generated.json \
            src/data/runtimeVisualCompletion.generated.json \
            src/data/visualCoverageAudit.generated.json \
            docs/RUNTIME_VISUAL_COMPLETION.generated.md \
            docs/VISUAL_COVERAGE_AUDIT.generated.md
          if git diff --cached --quiet; then
            echo 'Final runtime visual outputs are already current.'
            exit 0
          fi
          git fetch origin "$branch"
          latest="$(git rev-parse "origin/$branch")"
          if [ "$latest" != "$START_SHA" ]; then
            echo "Branch moved from $START_SHA to $latest; refusing to push stale generated output."
            exit 0
          fi
          git commit -m 'chore: complete all local runtime visual players'
          git push origin HEAD:"$branch"

      - name: Upload completion proof
        uses: actions/upload-artifact@v4
        with:
          name: final-runtime-visual-completion
          path: |
            src/data/runtimeVisualCompletion.generated.json
            src/data/visualDefenseTiming.generated.json
            src/data/visualSyntheticFallbacks.generated.json
            docs/RUNTIME_VISUAL_COMPLETION.generated.md
          retention-days: 14
