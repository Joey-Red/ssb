name: Pro Lab sibling report

on:
  push:
    branches: [pro-lab/resolver-v3-remainder]
    paths:
      - .github/workflows/pro-lab-sibling-report.yml

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Sparse checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/workflows/pro-lab-sibling-report.yml
            scripts/report-pro-lab-catalog-siblings.ts
            src/data
            src/lib
            package.json
            package-lock.json
            tsconfig.json
            tsconfig.app.json
            tsconfig.node.json
            vite.config.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build report
        run: ./node_modules/.bin/vite-node scripts/report-pro-lab-catalog-siblings.ts pro-lab-catalog-sibling-resolutions.json
      - uses: actions/upload-artifact@v4
        with:
          name: pro-lab-catalog-sibling-resolutions
          path: pro-lab-catalog-sibling-resolutions.json
