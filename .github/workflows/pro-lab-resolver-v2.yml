name: Pro Lab resolver v2 bulk

on:
  push:
    branches:
      - pro-lab/resolver-v2-bulk-350
    paths:
      - scripts/resolve-pro-lab-links.ts
      - .github/workflows/pro-lab-resolver-v2.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: .cache/pro-lab-resolver
          key: pro-lab-resolver-v2-${{ runner.os }}
      - name: Resolve source indexes in parallel
        env:
          PRO_LAB_RESOLVER_CONCURRENCY: '16'
          PRO_LAB_RESOLVER_MAX_CONCURRENCY: '24'
          PRO_LAB_RESOLVER_PLAYER_CONCURRENCY: '8'
          PRO_LAB_RESOLVER_PAGE_CONCURRENCY: '4'
        run: ./node_modules/.bin/vite-node scripts/resolve-pro-lab-links.ts pro-lab-link-resolutions-v2.json src/data/proLabVodLinkResolutionsBulk2.ts
      - name: Show resolver totals
        run: jq '{unresolvedInput,resolvedCount,unresolvedAfter,tierCounts,concurrency,ambiguous:(.ambiguous|length),unavailablePlayers:(.unavailablePlayers|length)}' pro-lab-link-resolutions-v2.json
      - uses: actions/upload-artifact@v4
        with:
          name: pro-lab-link-resolutions-v2
          path: pro-lab-link-resolutions-v2.json
          if-no-files-found: error
      - name: Commit verified resolution map
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/data/proLabVodLinkResolutionsBulk2.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate Pro Lab resolver v2 bulk link map'
          git push
