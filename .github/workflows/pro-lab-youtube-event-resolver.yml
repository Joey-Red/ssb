name: Pro Lab YouTube event resolver

on:
  push:
    branches:
      - pro-lab/resolver-v2-bulk-350
    paths:
      - scripts/resolve-pro-lab-youtube-event-links.ts
      - .github/workflows/pro-lab-youtube-event-resolver.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            src/data
            src/lib
            package.json
            package-lock.json
            vite.config.ts
            tsconfig.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install -q -U yt-dlp
      - uses: actions/cache@v4
        with:
          path: .cache/pro-lab-youtube-resolver
          key: pro-lab-youtube-resolver-v1-${{ runner.os }}
      - name: Resolve event-aware links
        env:
          PRO_LAB_YT_SEARCH_CONCURRENCY: '16'
          PRO_LAB_YT_METADATA_CONCURRENCY: '28'
          PRO_LAB_YT_SEARCH_LIMIT: '20'
          PRO_LAB_YT_EVENT_MAX_DATE_DISTANCE_DAYS: '45'
        run: ./node_modules/.bin/vite-node scripts/resolve-pro-lab-youtube-event-links.ts pro-lab-youtube-event-resolutions.json src/data/proLabVodLinkResolutionsBulk3.ts
      - name: Report totals
        run: jq '{remainingInput,searchGroups,uniqueEventPairCandidates,datedCandidates,resolvedCount,combinedBulk2And3Resolved,projectedTotalCatalogSourceIndexAfter,maxDateDistanceDays,ambiguous:(.ambiguous|length),noCandidate:(.noCandidate|length),dateRejected:(.dateRejected|length),searchErrors:(.searchErrors|length)}' pro-lab-youtube-event-resolutions.json
      - uses: actions/upload-artifact@v4
        with:
          name: pro-lab-youtube-event-resolutions
          path: pro-lab-youtube-event-resolutions.json
          if-no-files-found: error
      - name: Commit verified event map
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/data/proLabVodLinkResolutionsBulk3.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate event-aware Pro Lab YouTube resolution map'
          git push
